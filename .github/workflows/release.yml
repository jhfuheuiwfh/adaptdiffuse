name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches app.__version__
        run: |
          version=$(python3 -c "import app; print(app.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          echo "app.__version__=$version  tag=$tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.__version__ ($version). Bump app/__init__.py first."
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "AdaptDiffuse $GITHUB_REF_NAME" \
            --generate-notes
